<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Gaurav Coaching Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Mulish:wght@400;500;600&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#2E1A47;
    --gold:#E07A3F;
    --cream:#FBF8F4;
    --teal:#6B4E8A;
    --ink:#1C1420;
    --cream-soft:#EDE2F2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Mulish',sans-serif;background:var(--cream);color:var(--ink);
    line-height:1.6;min-height:100vh;display:flex;flex-direction:column;
  }
  h1,h2,h3{font-family:'Zilla Slab',serif;color:var(--navy);line-height:1.2;}
  .mono{font-family:'Fira Code',monospace;letter-spacing:0.03em;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  header{background:var(--navy);padding:18px 0;}
  header .wrap{display:flex;justify-content:space-between;align-items:center;}
  .logo{color:var(--cream);font-family:'Zilla Slab',serif;font-size:1.25rem;font-weight:700;}
  .logo span{color:var(--gold);}
  nav a{color:var(--cream-soft);margin-left:26px;font-size:0.9rem;font-weight:500;}
  nav a:hover{color:var(--gold);}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px;}

  .auth-card{
    width:100%;max-width:420px;background:#fff;border:1px solid #E6DACB;
    border-radius:6px;padding:40px 36px;opacity:0;animation:fadeUp 0.6s ease forwards;
  }
  .auth-head{text-align:center;margin-bottom:28px;}
  .auth-head .eyebrow{
    font-family:'Fira Code',monospace;color:var(--gold);font-size:0.74rem;
    letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:10px;
  }
  .auth-head h1{font-size:1.55rem;}
  .auth-head p{color:#666;font-size:0.9rem;margin-top:8px;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:0.85rem;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border:1px solid #DECBB4;border-radius:3px;
    font-family:'Mulish',sans-serif;font-size:0.92rem;background:var(--cream);color:var(--ink);
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(124,154,111,0.18);}

  .row-between{display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;margin-bottom:22px;}
  .row-between label{display:flex;align-items:center;gap:6px;color:#555;font-weight:400;}
  .row-between a{color:var(--teal);font-weight:600;}
  .row-between a:hover{color:var(--gold);}

  .btn{
    display:inline-block;width:100%;padding:14px;border-radius:3px;font-weight:700;
    font-size:0.94rem;border:none;cursor:pointer;transition:transform 0.15s ease;
  }
  .btn-primary{background:var(--gold);color:#fff;}
  .btn-primary:hover{transform:translateY(-2px);}

  .divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:#999;font-size:0.8rem;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#E6DACB;}

  .switch-line{text-align:center;font-size:0.88rem;color:#555;}
  .switch-line a{color:var(--teal);font-weight:700;}
  .switch-line a:hover{color:var(--gold);}

  footer{background:var(--ink);color:var(--cream-soft);padding:22px 0;font-size:0.85rem;text-align:center;}
  footer a{color:var(--gold);}

  @media(max-width:640px){nav{display:none;}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">Gaurav <span>Coaching</span></div>
    <nav>
      <a href="landing-page-v5.html#courses">Courses</a>
      <a href="contact-v5.html">Contact</a>
      <a href="signup-v5.html">Sign Up</a>
    </nav>
  </div>
</header>

<main>
  <div class="auth-card">
    <div class="auth-head">
      <span class="eyebrow">Student Portal</span>
      <h1>Welcome Back</h1>
      <p>Apne account me login karein aur seekhna jaari rakhein.</p>
    </div>

    <form>
      <div class="field">
        <label for="email">Email or Phone</label>
        <input type="text" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <div class="row-between">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="divider">ya</div>

    <p class="switch-line">Account nahi hai? <a href="signup-v5.html">Sign up karein</a></p>
  </div>
</main>

<footer>
  <div class="wrap">
    Gaurav Coaching Institute, Kanpur, UP &nbsp;•&nbsp; <a href="tel:+910000000000">Call Now</a>
  </div>
</footer>

</body>
</html>
